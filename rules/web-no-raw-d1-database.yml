id: web-no-raw-d1-database
language: TypeScript
files:
  - apps/web/src/**/*.ts
  - apps/web/src/**/*.tsx
ignores:
  - apps/web/src/db/read-only-d1.ts
rule:
  kind: type_identifier
  regex: ^D1Database$
message: >-
  apps/web must not use D1Database directly. Use ReadOnlyD1 from
  apps/web/src/db/read-only-d1.ts (createReadOnlyD1 at the Worker boundary only).
