name: apps-web

on:
  push:
    paths:
      - 'apps/web/**'
      - 'apps/admin/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/apps-web.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/admin/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/apps-web.yml'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install sqlite3def
        run: |
          curl -sL https://github.com/sqldef/sqldef/releases/download/v3.11.26/sqlite3def_linux_amd64.tar.gz | tar xz
          sudo mv sqlite3def /usr/local/bin/
      - run: pnpm --filter @myblog/web typecheck
      - run: pnpm --filter @myblog/admin typecheck
      - run: pnpm --filter @myblog/web test
      - run: pnpm --filter @myblog/admin test
      - run: pnpm --filter @myblog/web run db:schema:check
      - name: web must not write to D1 in production src
        run: |
          if rg -n -i '\b(INSERT|UPDATE|DELETE|REPLACE)\b' apps/web/src --glob '*.ts' --glob '*.tsx'; then
            echo 'apps/web/src must be read-only for D1 (no INSERT/UPDATE/DELETE/REPLACE)'
            exit 1
          fi
          echo 'ok: no write SQL in apps/web/src'
