name: apps-web

on:
  push:
    paths:
      - 'apps/web/**'
      - 'apps/admin/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install sqlite3def
        run: |
          curl -sL https://github.com/sqldef/sqldef/releases/download/v3.11.26/sqlite3def_linux_amd64.tar.gz | tar xz
          sudo mv sqlite3def /usr/local/bin/
      - run: pnpm --filter @myblog/web typecheck
      - run: pnpm --filter @myblog/admin typecheck
      - run: pnpm --filter @myblog/admin test
      - run: if rg -n "from .hono|from .markdown-it|from .jose|D1Database" apps/admin/src/domain -g "*.ts"; then exit 1; fi
      - run: if rg -n "\b(INSERT|UPDATE|DELETE|REPLACE)\b" apps/web/src -g "*.ts" -g "*.tsx"; then exit 1; fi
      - run: pnpm --filter @myblog/web run db:schema:check
