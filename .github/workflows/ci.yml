name: apps-web

on:
  push:
    paths:
      - 'apps/web/**'
      - 'apps/admin/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install sqlite3def
        run: |
          curl -sL https://github.com/sqldef/sqldef/releases/download/v3.11.26/sqlite3def_linux_amd64.tar.gz | tar xz
          sudo mv sqlite3def /usr/local/bin/
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @myblog/web run db:schema:check
