name: go

on:
  push:
    paths:
      - 'tools/**'
      - '.github/workflows/go.yml'
  pull_request:
    paths:
      - 'tools/**'
      - '.github/workflows/go.yml'

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod
      - run: go vet ./cmd/... ./internal/...
      - run: go test -race ./cmd/... ./internal/...
      - run: GOTOOLCHAIN=auto go run golang.org/x/tools/cmd/deadcode@v0.51.0 ./cmd/... ./internal/... | awk '{ print } END { exit NR > 0 }'
