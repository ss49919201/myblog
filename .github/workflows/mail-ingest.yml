name: mail-ingest

on:
  push:
    paths:
      - 'apps/mail-ingest/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/mail-ingest.yml'
  pull_request:
    paths:
      - 'apps/mail-ingest/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/mail-ingest.yml'

permissions:
  contents: read

jobs:
  mail-ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @myblog/mail-ingest typecheck && pnpm --filter @myblog/mail-ingest test
